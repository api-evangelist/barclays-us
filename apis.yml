name: Barclays US
kind: company
description: >-
  Barclays US is the United States consumer banking arm of Barclays PLC,
  operated through Barclays Bank Delaware, a Delaware state-chartered bank
  headquartered in Wilmington. Doing business as Barclays US (barclaysus.com
  redirects to cards.barclaycardus.com), it is one of the largest co-branded
  credit card issuers in the country, running highly customized card programs
  for major travel, airline, retail, and affinity partners (JetBlue, American
  Airlines, Wyndham, AARP, Gap, and others), alongside small-business cards,
  installment loans, point-of-sale financing, and a direct-to-consumer online
  savings and CD franchise. Unlike Barclays UK — which operates a mandated PSD2
  Open Banking API Exchange at developer.barclays.com — the US consumer entity
  publishes no first-party public developer portal or downloadable API
  specification. US open finance is voluntary and fragmented, so consumer-
  permissioned account and card data from Barclays US is reached in practice
  through third-party data aggregators rather than a documented first-party
  API. No FDX-conformant data-access endpoint or formally stated CFPB Section
  1033 posture is published on the US site as of this profile.
