    note: Barclays UK API Exchange (PSD2 Open Banking) — separate UK entity; explicitly NOT the US consumer bank.
  - url: https://www.openbankingtracker.com/country/united-states
    type: Reference
    note: US open banking is voluntary/aggregator-driven (Plaid, MX, Finicity, Akoya, Yodlee); no single mandated contract.
actions:
  apisYmlApis: []
  reason: |
    No first-party public API, no downloadable specification, and no
    documented FDX/1033 data-access endpoint were found for Barclays US. The
    apis[] array is intentionally empty and no OpenAPI was harvested. This is
    an honest identity-only (built-stub) profile: aggregator-only data access.
