    type: Website
    note: Barclays US consumer site; co-brand credit cards, small-business cards, installment loans, POS finance, online savings, CDs. No API.
  - url: https://cards.barclaycardus.com/banking/about-us/
    type: About
    note: Describes Barclays US as a leading US co-branded credit card issuer and financial services partner.
  - url: https://developer.barclays.com
